name: Stolostron Frontend Unit Tests

on:
  pull_request:
    paths:
      - 'public/app/**'
      - 'packages/**'
      - 'jest.config.js'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/stolostron-frontend-tests.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  changed-jest-tests:
    name: Changed-File Jest Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Detect changed frontend source files
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq_filter='.[] | select(.status != "removed") | .filename | '
          jq_filter+='select((startswith("public/app/") or '
          jq_filter+='startswith("packages/")) and '
          jq_filter+='test("\\.(ts|tsx|js|jsx|mjs|cjs)$"))'
          changed_files="$(
            gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
              --jq "${jq_filter}" \
            | sort -u
          )"
          {
            echo "files<<EOF"
            echo "${changed_files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          if [ -n "${changed_files}" ]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
            echo "Changed frontend files:"
            echo "${changed_files}"
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
            echo "No JS/TS files changed under public/app/ or packages/."
          fi

      - name: Setup Node
        if: steps.changed.outputs.has_files == 'true'
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        if: steps.changed.outputs.has_files == 'true'
        run: yarn install --immutable --check-cache

      - name: Run related Jest unit tests
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            [ -n "${f}" ] && [ -f "${f}" ] && files+=("${f}")
          done <<< "${CHANGED_FILES}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No existing changed frontend files to test."
            exit 0
          fi
          echo "Running Jest related tests for ${#files[@]} file(s)..."
          yarn jest --ci --findRelatedTests --passWithNoTests "${files[@]}"
