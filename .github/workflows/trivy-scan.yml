name: Trivy Scan
on:
  pull_request:
    # only run on PRs where go.mod/go.sum/etc have been updated
    paths:
      - go.*
      - .github/workflows/trivy-scan.yml
  push:
    branches:
      - main
    paths:
      - go.*
      - .github/workflows/trivy-scan.yml

jobs:
  trivy-scan:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Run Trivy vulnerability scanner
      # Use trivy-action (Docker-based) instead of setup-trivy (binary download).
      # The aquasecurity org has an IP allowlist that blocks binary downloads
      # from stolostron GitHub Actions runners. trivy-action pulls its image
      # from ghcr.io which is not affected by that restriction.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH
        trivyignores: .trivyignore
        skip-files: yarn.lock,package.json
    - name: Run Trivy vulnerability scanner (SARIF)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        format: sarif
        output: trivy-results.sarif
        ignore-unfixed: true
        vuln-type: os,library
        trivyignores: .trivyignore
      if: always() && github.repository == 'grafana/grafana'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      if: always() && github.repository == 'grafana/grafana'
